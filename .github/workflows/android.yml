name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e lint (inclui checagens de segurança do Android)
        run: ./gradlew testDebugUnitTest lintRelease

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        # o app compara a tag com o versionName; se não baterem, ele pediria para atualizar para sempre
        run: grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts || { echo "::error::Tag $GITHUB_REF_NAME diferente do versionName em app/build.gradle.kts"; exit 1; }

      - name: Restaurar keystore de release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tilim.jks"

      - name: Build APK release
        env:
          TILIM_KEYSTORE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/tilim.jks', runner.temp) || '' }}
          TILIM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TILIM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TILIM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$TILIM_KEYSTORE" ] || unset TILIM_KEYSTORE
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Tilim-${GITHUB_REF_NAME//\//-}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tilim-apk
          path: Tilim-*.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # notas da Release = seção desta versão no CHANGELOG.md (de "## 1.6.0" até o próximo "## ")
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notas.md
          [ -s notas.md ] || { echo "::error::CHANGELOG.md sem seção ## ${GITHUB_REF_NAME#v}"; exit 1; }
          # nasce em draft: revisar e clicar em "Publish release"; o app só enxerga a versão depois de publicada
          gh release create "$GITHUB_REF_NAME" Tilim-*.apk --title "Tilim $GITHUB_REF_NAME" --notes-file notas.md --draft
